name: E-Commerce CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Verify Project Structure
      - name: Verify Files
        run: |
          pwd
          ls -la
          ls -la backend
          ls -la kubernetes
          ls -la terraform

      # Setup Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Verify Docker Username Secret
      - name: Verify Docker Username
        run: |
          echo "Docker Username = ${{ secrets.DOCKER_USERNAME }}"

      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ecommerce-app:latest ./backend

      # Push Docker Image
      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ecommerce-app:latest

      # Setup kubectl
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      # Configure Kubernetes Access
      - name: Configure Kubernetes
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" > $HOME/.kube/config

      # Verify Kubernetes Cluster
      - name: Verify Kubernetes Cluster
        run: |
          kubectl get nodes

      # Deploy Kubernetes Manifests
      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f kubernetes/

      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      # Terraform Init
      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      # Terraform Validate
      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      # Terraform Plan
      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan

      # Terraform Apply
      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve
